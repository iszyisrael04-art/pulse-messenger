name: Pulse iOS compile check
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: pulse-ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check Xcode and Swift toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Test iOS runner configuration
        run: python3 -m unittest discover -s test -p test_bootstrap_ios.py
      - name: Generate iOS runner and permissions
        run: python3 scripts/bootstrap_ios.py
      - name: Check public configuration
        run: python3 scripts/check_config.py config.example.json
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build iOS without distribution signing
        run: flutter build ios --release --no-codesign --dart-define-from-file=config.example.json
      - name: Package unsigned app with executable permissions
        run: tar -czf Pulse-iOS-Unsigned.tar.gz -C build/ios/iphoneos Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-iOS-Unsigned
          path: Pulse-iOS-Unsigned.tar.gz
