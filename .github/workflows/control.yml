name: Pulse Control staff builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: python3 scripts/bootstrap.py
      - run: python scripts/check_config.py config.example.json
      - run: python scripts/configure_staff.py
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test video visibility
        run: dart test/video_visibility_offline.dart
      - name: Test appearance preferences
        run: dart test/appearance_offline.dart
      - run: python -m unittest discover -s test -p "test_*.py"
      - name: Test streaming account export
        run: dart test/data_export_offline.dart
      - name: Test chat marks
        run: dart test/chat_state_offline.dart
      - name: Test call delivery states
        run: dart test/call_signal_offline.dart

      - name: Test creator product prices
        run: dart test/creator_products_offline.dart
      - name: Test profile rules
        run: dart test/profile_rules_offline.dart
      - name: Test support email encoding
        run: dart test/support_draft_offline.dart
      - name: Test activity and support identity
        run: dart test/activity_offline.dart
      - run: flutter test
      - name: Test native chunked upload transport
        run: dart test/social_upload_offline.dart
      - name: Install Android NDK
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"
          if [ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            "$SDKMANAGER" --install "ndk;$NDK_VERSION"
          fi
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
      # Private-beta APK uses debug signing. Release signing requires a real keystore.
      - run: flutter build apk --debug --dart-define-from-file=config.example.json --dart-define=PULSE_STAFF=true
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-Control-Android-Beta
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            pubspec.lock
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: python scripts/bootstrap.py
      - run: python scripts/check_config.py config.example.json
      - run: python scripts/configure_staff.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test video visibility
        run: dart test/video_visibility_offline.dart
      - name: Test appearance preferences
        run: dart test/appearance_offline.dart
      - run: python -m unittest discover -s test -p "test_*.py"
      - name: Test streaming account export
        run: dart test/data_export_offline.dart
      - name: Test chat marks
        run: dart test/chat_state_offline.dart
      - name: Test call delivery states
        run: dart test/call_signal_offline.dart

      - name: Test creator product prices
        run: dart test/creator_products_offline.dart
      - name: Test profile rules
        run: dart test/profile_rules_offline.dart
      - name: Test support email encoding
        run: dart test/support_draft_offline.dart
      - name: Test activity and support identity
        run: dart test/activity_offline.dart
      - run: flutter test
      - name: Fix Windows native compatibility
        shell: pwsh
        run: |
          $path = "windows/CMakeLists.txt"
          $content = Get-Content $path -Raw
          $oldRule = 'install(TARGETS pulse_editor RUNTIME DESTINATION "." COMPONENT Runtime)'
          $newRule = 'install(FILES "$<TARGET_FILE:pulse_editor>" DESTINATION "${CMAKE_INSTALL_PREFIX}" COMPONENT Runtime)'
          $content = $content.Replace($oldRule, $newRule)
          $prefix = "set(CMAKE_POLICY_VERSION_MINIMUM 3.5)`n"
          $prefix += "add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)`n"
          Set-Content -Path $path -Value ($prefix + $content) -Encoding utf8
      - name: Build Windows with installation diagnostics
        env:
          PULSE_STAFF_APP: "1"
        run: python scripts/build_windows.py
      - name: Save Windows build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Control-Build-Logs
          path: build-logs/*.log
          if-no-files-found: ignore
      - run: choco install innosetup --yes --no-progress
      - shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" scripts/windows-control-installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-Control-Windows-Beta
          path: |
            dist/*.exe
            build/windows/x64/runner/Release/
            pubspec.lock
  isolated_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix test/isolated_backend
      - run: node test/isolated_backend/run.mjs
      - run: node test/squad_sandbox_test.mjs
      - run: node test/payment_live_test.mjs
      - run: node test/call_push_offline.mjs
