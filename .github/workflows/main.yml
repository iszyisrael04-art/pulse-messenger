name: Pulse native beta builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Generate native runners
        run: python3 scripts/bootstrap.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test bootstrap
        run: python3 test/test_bootstrap.py

      - name: Run Flutter tests
        run: flutter test

      - name: Install Android NDK
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"

          if [ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            "$SDKMANAGER" --install "ndk;$NDK_VERSION"
          fi

          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"

      # Private-beta APK uses debug signing.
      # Production releases require a stable signing keystore.
      - name: Build Android APK
        timeout-minutes: 60
        run: flutter build apk --debug --dart-define-from-file=config.example.json

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Android-Beta
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            pubspec.lock

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Generate native runners
        run: python scripts/bootstrap.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test bootstrap
        run: python test/test_bootstrap.py

      - name: Run Flutter tests
        run: flutter test

      - name: Fix Windows native compatibility
        shell: pwsh
        run: |
          $path = "windows/CMakeLists.txt"
          $content = Get-Content $path -Raw
          $prefix = "set(CMAKE_POLICY_VERSION_MINIMUM 3.5)`n"
          $prefix += "add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)`n"
          Set-Content -Path $path -Value ($prefix + $content) -Encoding utf8

      - name: Build Windows application
        run: flutter build windows --release --dart-define-from-file=config.example.json

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" scripts/windows-installer.iss'

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Windows-Beta
          if-no-files-found: error
          path: |
            dist/*.exe
            build/windows/x64/runner/Release/
            pubspec.lock
