name: Pulse native beta builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Generate native runners
        run: python3 scripts/bootstrap.py

      - name: Check public configuration
        run: python3 scripts/check_config.py config.example.json

      - name: Install dependencies
        run: flutter pub get

      - name: Format source
        run: dart format lib test

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test video visibility
        run: dart test/video_visibility_offline.dart

      - name: Test appearance preferences
        run: dart test/appearance_offline.dart

      - name: Test Python helpers
        run: python3 -m unittest discover -s test -p "test_*.py"

      - name: Test streaming account export
        run: dart test/data_export_offline.dart

      - name: Run Flutter tests
        run: flutter test

      - name: Test upload transport
        run: dart test/social_upload_offline.dart

      - name: Install Android NDK
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"

          if [ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            "$SDKMANAGER" --install "ndk;$NDK_VERSION"
          fi

          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"

      - name: Build Android beta APK
        run: flutter build apk --debug --dart-define-from-file=config.example.json

      - name: Upload Android application
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Android-Beta
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            pubspec.lock

  windows:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Generate native runners
        run: python scripts/bootstrap.py

      - name: Check public configuration
        run: python scripts/check_config.py config.example.json

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test video visibility
        run: dart test/video_visibility_offline.dart

      - name: Test appearance preferences
        run: dart test/appearance_offline.dart

      - name: Test Python helpers
        run: python -m unittest discover -s test -p "test_*.py"

      - name: Test streaming account export
        run: dart test/data_export_offline.dart

      - name: Run Flutter tests
        run: flutter test

      - name: Fix Windows native compatibility
        shell: pwsh
        run: |
          $path = "windows/CMakeLists.txt"
          $content = Get-Content $path -Raw

          $prefix = "set(CMAKE_POLICY_VERSION_MINIMUM 3.5)`n"
          $prefix += "add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)`n"

          Set-Content -Path $path -Value ($prefix + $content) -Encoding utf8

      - name: Build Windows with detailed logs
        run: python scripts/build_windows.py

      - name: Save Windows build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Windows-Build-Logs
          path: build-logs/*.log
          if-no-files-found: ignore

      - name: Install installer tools
        run: choco install innosetup --yes --no-progress

      - name: Create Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" scripts/windows-installer.iss

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Windows-Beta
          path: |
            dist/*.exe
            build/windows/x64/runner/Release/
            pubspec.lock
